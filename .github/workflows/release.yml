# SnapSort release pipeline
# Triggered by a version tag push (e.g. v1.2.3).
# Builds native installers on macOS and Windows runners via the Tauri bundler,
# then attaches all artifacts to a GitHub Release.
# Signing credentials are read exclusively from repository secrets — nothing secret is committed.

name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

# Allow this workflow to create GitHub Releases and upload assets.
permissions:
  contents: write

jobs:
  # ─── macOS ─────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS code signing ───────────────────────────────────────────────
          # Export a Developer ID Application certificate from Keychain Access as
          # a .p12 file, base64-encode it, and store as APPLE_CERTIFICATE.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # ── notarization (App Store Connect API key recommended) ─────────────
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ── Tauri updater bundle signing ─────────────────────────────────────
          # Generate with: tauri signer generate -w ~/.tauri/snapsort.key
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SnapSort ${{ github.ref_name }}'
          releaseBody: |
            See the [changelog](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for what's new.

            ## Install

            | Platform | Download |
            |---|---|
            | macOS | `.dmg` below |
            | Windows | `.exe` / `.msi` below |
          releaseDraft: true
          prerelease: false

  # ─── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe / .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Windows code signing ─────────────────────────────────────────────
          # Export a code-signing certificate as base64-encoded PFX and store as
          # WINDOWS_CERTIFICATE; set the password as WINDOWS_CERTIFICATE_PASSWORD.
          # If secrets are absent the build still succeeds (unsigned installer).
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # ── Tauri updater bundle signing ─────────────────────────────────────
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SnapSort ${{ github.ref_name }}'
          releaseBody: |
            See the [changelog](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for what's new.

            ## Install

            | Platform | Download |
            |---|---|
            | macOS | `.dmg` below |
            | Windows | `.exe` / `.msi` below |
          releaseDraft: true
          prerelease: false

  # ─── Linux (AppImage) ──────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Tauri / WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SnapSort ${{ github.ref_name }}'
          releaseBody: |
            See the [changelog](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for what's new.

            ## Install

            | Platform | Download |
            |---|---|
            | macOS | `.dmg` below |
            | Windows | `.exe` / `.msi` below |
          releaseDraft: true
          prerelease: false
