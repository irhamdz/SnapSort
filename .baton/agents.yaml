orchestrator:
  runtime: claude-code
  model: claude-opus-4-6

runtimes:
  claude-code:
    command: claude
    model_flag: "--model"
    extra_flags:
      - "--print"
      - "--dangerously-skip-permissions"
    positional:
      - "{{prompt}}"
    workdir: inherit
    models:
      - claude-opus-4-6
    tool_restriction:
      flag: "--allowedTools"
      format: "comma-separated"

  opencode:
    command: opencode
    model_flag: "--model"
    context_flag: "--file"
    positional:
      - run
      - "{{prompt}}"
    extra_flags:
      - "--dangerously-skip-permissions"
    workdir: inherit
    models:
      - nvidia/moonshotai/kimi-k2.5
      - minimax-coding-plan/MiniMax-M2.7-highspeed
      - deepseek/deepseek-chat-v3-0324
      - google/gemini-flash-1.5

  codex:
    command: codex
    model_flag: "--model"
    positional:
      - "{{prompt}}"
    extra_flags:
      - "--full-auto"
    workdir: inherit
    models:
      - o4-mini
      - o3

defaults:
  runtime: opencode
  model: minimax-coding-plan/MiniMax-M2.7-highspeed

routing:
  rules:
    - match:
        domain: [frontend, ui, css, react, tailwind, typescript]
      action: delegate
      runtime: opencode
      model: nvidia/moonshotai/kimi-k2.5

    - match:
        domain: [backend, rust, tauri, sqlite, ocr, watcher]
      action: delegate
      runtime: opencode
      model: deepseek/deepseek-chat-v3-0324

    - match:
        domain: [testing, boilerplate, migration]
      action: delegate
      runtime: opencode
      model: google/gemini-flash-1.5

    - match:
        domain: [architecture, security, design, planning]
      action: delegate
      runtime: claude-code
      model: claude-opus-4-6

    - match:
        default: true
      action: delegate
      runtime: opencode
      model: minimax-coding-plan/MiniMax-M2.7-highspeed

  checkpoint_interval: 3
  critical_review: claude-opus-4-6

phase_machine:
  enabled: true
  complexity_default: MEDIUM
  max_l1_retries: 3
  max_l2_cycles: 3
  heartbeat_budget: 50

role_models:
  lead:
    runtime: claude-code
    model: claude-opus-4-6
  developer:
    runtime: opencode
    model: nvidia/moonshotai/kimi-k2.5
  reviewer:
    runtime: claude-code
    model: claude-opus-4-6
  test_lead:
    runtime: claude-code
    model: claude-opus-4-6
  tester:
    runtime: opencode
    model: google/gemini-flash-1.5

skills:
  dir: .baton/skills/
  domain_map:
    rs: backend
    toml: backend
    tsx: frontend
    ts: frontend
    css: frontend
    sql: backend
    test: testing

clarification_patterns:
  - CLARIFICATION_NEEDED
  - "I'm not sure"
  - "could you clarify"
clarification_exit_code: 10

event_log: .baton/events.ndjson
task_dir: .baton/tasks
result_dir: .baton/results
spec_dir: .baton/specs
lock_file: .baton/locks.yaml
project_brief: .baton/project-brief.md
default_timeout: "10m"
output_tail_lines: 50
