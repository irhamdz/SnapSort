orchestrator:
  runtime: claude-code
  model: sonnet

runtimes:
  claude-code:
    command: claude
    model_flag: "--model"
    extra_flags:
      - "--print"
      - "--dangerously-skip-permissions"
    positional:
      - "{{prompt}}"
    workdir: inherit
    models:
      - sonnet
    tool_restriction:
      flag: "--allowedTools"
      format: "comma-separated"

  opencode:
    command: opencode
    model_flag: "--model"
    context_flag: "--file"
    positional:
      - run
      - "{{prompt}}"
    extra_flags:
      - "--dangerously-skip-permissions"
    workdir: inherit
    models:
      - CrofAI/kimi-k2.5
      - CrofAI/glm-5.1-precision
      - CrofAI/glm-5

  codex:
    command: codex
    model_flag: "--model"
    positional:
      - "{{prompt}}"
    extra_flags:
      - "--full-auto"
    workdir: inherit
    models:
      - o4-mini
      - o3

defaults:
  runtime: opencode
  model: CrofAI/glm-5.1-precision

routing:
  rules:
    - match:
        domain: [frontend, ui, css, react, tailwind, typescript]
      action: delegate
      runtime: opencode
      model: CrofAI/kimi-k2.5

    - match:
        domain: [backend, rust, tauri, sqlite, ocr, watcher]
      action: delegate
      runtime: opencode
      model: CrofAI/glm-5.1-precision

    - match:
        domain: [testing, boilerplate, migration]
      action: delegate
      runtime: opencode
      model: CrofAI/glm-5

    - match:
        domain: [architecture, security, design, planning]
      action: delegate
      runtime: claude-code
      model: sonnet
      reason: "Claude's strength in reasoning and planning makes it ideal for high-level tasks."

    - match:
        default: true
      action: delegate
      runtime: opencode
      model: CrofAI/glm-5.1-precision

  checkpoint_interval: 3
  critical_review: sonnet

phase_machine:
  enabled: true
  complexity_default: MEDIUM
  max_l1_retries: 3
  max_l2_cycles: 3
  heartbeat_budget: 50

role_models:
  lead:
    runtime: claude-code
    model: sonnet
  developer:
    runtime: opencode
    model: CrofAI/kimi-k2.5
  reviewer:
    runtime: opencode
    model: CrofAI/glm-5.1-precision
  test_lead:
    runtime: opencode
    model: CrofAI/glm-5
  tester:
    runtime: opencode
    model: CrofAI/glm-5

skills:
  dir: .baton/skills/
  domain_map:
    rs: backend
    toml: backend
    tsx: frontend
    ts: frontend
    css: frontend
    sql: backend
    test: testing

clarification_patterns:
  - CLARIFICATION_NEEDED
  - "I'm not sure"
  - "could you clarify"
clarification_exit_code: 10

event_log: .baton/events.ndjson
task_dir: .baton/tasks
result_dir: .baton/results
spec_dir: .baton/specs
lock_file: .baton/locks.yaml
project_brief: .baton/project-brief.md
default_timeout: "10m"
output_tail_lines: 50
